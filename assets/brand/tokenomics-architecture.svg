<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0B2545"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#ffffff"/>

  <!-- top: lending institution -->
  <rect x="210" y="18" width="300" height="56" rx="8" fill="#0B2545"/>
  <text x="360" y="42" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Lending institution</text>
  <text x="360" y="61" text-anchor="middle" fill="#cfd9e8" font-size="12">holds the note asset at face value for the life of the loan</text>

  <!-- branch lines -->
  <path d="M 360 74 L 360 96 M 180 96 L 540 96 M 180 96 L 180 118 M 540 96 L 540 118" stroke="#0B2545" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 180 96 L 180 118" stroke="#0B2545" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 540 96 L 540 118" stroke="#0B2545" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- column labels -->
  <text x="168" y="113" text-anchor="end" fill="#555F6B" font-size="11" font-weight="700" letter-spacing="1">ASSET LAYER</text>
  <text x="552" y="113" text-anchor="start" fill="#555F6B" font-size="11" font-weight="700" letter-spacing="1">SERVICING RAIL</text>

  <!-- left: MPT note -->
  <rect x="40" y="124" width="280" height="78" rx="8" fill="#135BA6"/>
  <text x="180" y="150" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Multi-Purpose Token note asset</text>
  <text x="180" y="170" text-anchor="middle" fill="#dfe8f5" font-size="12">one issuance per loan, the digital twin of the note</text>
  <text x="180" y="188" text-anchor="middle" fill="#dfe8f5" font-size="12">transferable, escrowable, holdable · RequireAuth</text>

  <!-- right: TokenEscrow -->
  <rect x="400" y="124" width="280" height="78" rx="8" fill="#135BA6"/>
  <text x="540" y="150" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">TokenEscrow (XLS-85)</text>
  <text x="540" y="170" text-anchor="middle" fill="#dfe8f5" font-size="12">monthly fixed P&amp;I leg and impound leg</text>
  <text x="540" y="188" text-anchor="middle" fill="#dfe8f5" font-size="12">date-locked: cannot finish before the due date</text>

  <!-- down arrows -->
  <path d="M 180 202 L 180 232" stroke="#0B2545" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 540 202 L 540 232" stroke="#0B2545" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- left bottom: XLS-65/66 future -->
  <rect x="40" y="236" width="280" height="78" rx="8" fill="#F3F5F8" stroke="#135BA6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="180" y="262" text-anchor="middle" fill="#0B2545" font-size="15" font-weight="700">XLS-65 vault / XLS-66 lending</text>
  <text x="180" y="282" text-anchor="middle" fill="#555F6B" font-size="12">forward compatibility only · Devnet today</text>
  <text x="180" y="300" text-anchor="middle" fill="#555F6B" font-size="12">not exercised in this phase</text>

  <!-- right bottom: payment rail -->
  <rect x="400" y="236" width="280" height="78" rx="8" fill="#F3F5F8" stroke="#135BA6" stroke-width="2"/>
  <text x="540" y="262" text-anchor="middle" fill="#0B2545" font-size="15" font-weight="700">Immutable payment rail</text>
  <text x="540" y="282" text-anchor="middle" fill="#555F6B" font-size="12">each validated EscrowFinish is a proof of payment</text>
  <text x="540" y="300" text-anchor="middle" fill="#555F6B" font-size="12">re-read from the ledger by the audit sweep</text>

  <!-- footer -->
  <text x="360" y="342" text-anchor="middle" fill="#555F6B" font-size="11">Borrower identity, escrow analysis and outstanding balance stay in the servicer's books. Nothing personal reaches the ledger.</text>
</svg>
