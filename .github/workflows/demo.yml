name: testnet-loan-year
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # weekly Monday 06:17 UTC keeps the published Testnet proof fresh
permissions:
  contents: write
jobs:
  loan-year:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ingest
      - run: npm run loan-year -- --key-drill --step 35      # Testnet: Mainnet-live transaction types only; ~10 min
      - run: npm run test:testnet
      - uses: actions/upload-artifact@v4
        with: { name: loan-year, path: out/ }
      - name: Commit refreshed Testnet proof
        run: |
          git config user.name "testnet-loan-year bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/testnet-run.md docs/clock-mapping-manifest.json docs/escrow-analysis-example.md docs/form-1098-example.json docs/demo/run.json
          git diff --cached --quiet || git commit -m "proof: refresh Testnet loan-year $(date -u +%F)" && git push
