name: devnet-demo
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # weekly Monday 06:17 UTC keeps the published run fresh
permissions:
  contents: write
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils
      - run: npm ci
      - run: npm run ingest
      - run: npm run print
      - run: npm run scan -- out/print/closing-package-stack.pdf
      - run: npm run demo            # fresh faucet wallets on the runner; ~5 minutes
      - run: npm run export
      - run: npm run demo:publish
      - run: |
          { echo "# Devnet run log"; echo; echo "Latest full run of \`npm run demo\` (every transaction tesSUCCESS). Regenerated by the devnet-demo workflow."; echo; sed '1d' out/latest.md; } > docs/devnet-run.md
      - uses: actions/upload-artifact@v4
        with: { name: devnet-run, path: out/ }
      - name: Commit refreshed demo page
        run: |
          git config user.name "devnet-demo bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/demo docs/devnet-run.md
          git diff --cached --quiet || git commit -m "demo: refresh Devnet run $(date -u +%F)" && git push
