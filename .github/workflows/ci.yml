name: ci
on:
  push:
    branches: [main, v3, 'claude/**', 'codex/**']
  pull_request:
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements-py.txt }
      - run: pip install -r requirements-py.txt
      - run: python -m compileall -q mortgageos tests/py
      # The live phases need XRPL Testnet plus the councilforge database (Tailscale-only); they run from an operator
      # machine: `python -m pytest tests/py/test_mpt_core.py`. CI proves the math and that the package imports.
      - run: python -m pytest tests/py/test_mpt_core.py -k offline -q
